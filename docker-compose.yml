services:
  mariadb:
    image: mariadb:11.4
    environment:
      MARIADB_DATABASE: konto
      MARIADB_USER: konto
      MARIADB_PASSWORD: konto
      MARIADB_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - mariadb-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 3s
      retries: 20

  app:
    build: .
    depends_on:
      mariadb:
        condition: service_healthy
    environment:
      DB_URL: jdbc:mariadb://mariadb:3306/konto
      DB_USER: konto
      DB_PASSWORD: konto
    ports:
      - "8080:8080"

volumes:
  mariadb-data:

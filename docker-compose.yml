services:
  mariadb:
    image: mariadb:11.4
    environment:
      MARIADB_DATABASE: konto
      MARIADB_USER: konto
      MARIADB_PASSWORD: konto
      MARIADB_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - mariadb-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  mariadb-data:

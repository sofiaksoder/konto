spring:
  application:
    name: konto
  datasource:
    url: ${DB_URL:jdbc:mariadb://localhost:3306/konto}
    username: ${DB_USER:konto}
    password: ${DB_PASSWORD:konto}
  jpa:
    hibernate:
      ddl-auto: validate   # the schema is owned by Flyway (db/migration); Hibernate only checks it
    open-in-view: false
    properties:
      hibernate:
        jdbc.time_zone: UTC
  flyway:
    # Databases created before Flyway (by Hibernate's old ddl-auto=update) are adopted as version 1.
    baseline-on-migrate: true
    baseline-version: 1
  threads:
    virtual:
      enabled: true
  web:
    resources:
      cache:
        cachecontrol:
          no-cache: true   # browsers re-validate static files each load, so UI edits show up on refresh

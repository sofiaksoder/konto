spring:
  application:
    name: konto
  datasource:
    url: ${DB_URL:jdbc:mariadb://localhost:3306/konto}
    username: ${DB_USER:konto}
    password: ${DB_PASSWORD:konto}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        jdbc.time_zone: UTC
  threads:
    virtual:
      enabled: true
  web:
    resources:
      cache:
        cachecontrol:
          no-cache: true   # browsers re-validate static files each load, so UI edits show up on refresh
